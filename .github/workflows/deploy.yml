name: Rust CD
run-name: ${{ github.ref_name }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REPO: ${{ github.repository }}
  VERSION: ${{ github.ref_name }}
  BIN_NAME: rune-infer

jobs:
  # Optional: mirrors the npm publish matrix if publishing crates
  # publish:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: macos-arm64
            target: aarch64-apple-darwin
            ext: ''

          - platform: 'macos-15-intel'
            name: macos-x64
            target: x86_64-apple-darwin
            ext: ''

          - platform: 'ubuntu-latest'
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            ext: ''

          # Native arm64 runners (free for public repositories).
          - platform: 'ubuntu-24.04-arm'
            name: linux-arm64
            target: aarch64-unknown-linux-gnu
            ext: ''

          - platform: 'windows-latest'
            name: windows-x64
            target: x86_64-pc-windows-msvc
            ext: '.exe'

          # Newest target: a failure here must not block the other platforms.
          - platform: 'windows-11-arm'
            name: windows-arm64
            target: aarch64-pc-windows-msvc
            ext: '.exe'
            experimental: true

    continue-on-error: ${{ matrix.experimental || false }}
    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Cache Cargo Dependencies & Target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: ⚙️ Build Artifact
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.BIN_NAME }}

      - name: 📦 Package (archive + SHA-256)
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.name }}
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p dist
          SRC="target/${TARGET}/release"
          NAME="${BIN_NAME}-${PLATFORM}"
          if [ "$EXT" = ".exe" ]; then
            ARCHIVE="${NAME}.zip"
            pwsh -NoProfile -Command "Compress-Archive -Path '$SRC/${BIN_NAME}.exe' -DestinationPath 'dist/$ARCHIVE'"
          else
            ARCHIVE="${NAME}.tar.gz"
            tar -C "$SRC" -czf "dist/$ARCHIVE" "${BIN_NAME}"
          fi
          (cd dist && (sha256sum "$ARCHIVE" 2>/dev/null || shasum -a 256 "$ARCHIVE") > "$ARCHIVE.sha256")
          ls -l dist

      - name: ⬆️ Upload release assets
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          overwrite: true
          tag: ${{ env.VERSION }}

  # Make the installers available from the release itself, too.
  upload-installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: install.*
          file_glob: true
          overwrite: true
          tag: ${{ env.VERSION }}
