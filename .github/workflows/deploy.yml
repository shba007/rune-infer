name: Rust CD
run-name: ${{ github.ref_name }}

permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

on:
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

env:
  REPO: ${{ github.repository }}
  VERSION: ${{ github.ref_name }}
  BIN_NAME: rune-infer

jobs:
  # Optional: mirrors the npm publish matrix if publishing crates
  # publish:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: dtolnay/rust-toolchain@stable
  #     - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

  build-cli:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            name: macos-arm64
            target: aarch64-apple-darwin
            ext: ''

          - platform: 'macos-13'
            name: macos-x64
            target: x86_64-apple-darwin
            ext: ''

          - platform: 'ubuntu-latest'
            name: linux-x64
            target: x86_64-unknown-linux-gnu
            ext: ''

          - platform: 'windows-latest'
            name: windows-x64
            target: x86_64-pc-windows-msvc
            ext: '.exe'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: ⚡ Cache Cargo Dependencies & Target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: ⚙️ Build Artifact
        run: cargo build --release --locked --target ${{ matrix.target }} --bin ${{ env.BIN_NAME }}

      - name: ⚙️ Upload Artifact
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }}
          asset_name: ${{ env.BIN_NAME }}_${{ env.VERSION }}_${{ matrix.name }}${{ matrix.ext }}
          tag: ${{ env.VERSION }}
