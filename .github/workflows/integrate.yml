name: Rust CI

permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-bump:
    if: >
      !(
        contains(github.event.head_commit.message, 'ci(release):') ||
        contains(github.event.head_commit.message, '[skip ci]') ||
        startsWith(github.event.head_commit.message, 'Merge pull request') ||
        startsWith(github.event.head_commit.message, 'Merge branch')
      )
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: ⚡ Cache Cargo Dependencies & Target
        uses: Swatinem/rust-cache@v2

      - name: 🛠️ Install git-cliff & cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff,cargo-edit

      - name: 🧼 Check Code Formatting
        run: cargo fmt --all -- --check

      - name: 🧹 Lint Code with Clippy
        run: cargo clippy --all-targets --features cpu -- -D warnings

      - name: ✅ Run Tests
        run: cargo test --all-targets --features cpu

      - name: 🏷️ Bump Version
        id: bump_version
        run: |
          # 1. Calculate the next SemVer version from conventional commits
          NEXT_VERSION=$(git-cliff --bumped-version)
          CLEAN_VERSION=${NEXT_VERSION#v}

          # 2. Update Cargo.toml and Cargo.lock
          cargo set-version "$CLEAN_VERSION"
          cargo check --quiet

          # 3. Regenerate CHANGELOG.md
          git-cliff --tag "v$CLEAN_VERSION" --output CHANGELOG.md

          # 4. Extract release notes for PR body
          DELIMITER="EOF_$(openssl rand -hex 8)"
          echo "CHANGELOG_CONTENT<<$DELIMITER" >> "$GITHUB_ENV"
          git-cliff --unreleased --strip header >> "$GITHUB_ENV"
          echo "$DELIMITER" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$CLEAN_VERSION" >> "$GITHUB_ENV"

      - name: 🔀 Create or Update Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'ci(release): v${{ env.NEW_VERSION }}'
          title: 'ci(release): release v${{ env.NEW_VERSION }}'
          body: ${{ env.CHANGELOG_CONTENT }}
          branch: 'release/v${{ env.NEW_VERSION }}'
          base: 'main'
          delete-branch: true
