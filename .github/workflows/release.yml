name: Rust Release
# Owner promotes to main, then explicitly creates and pushes the version tag.
# Automation never creates source commits, branches or tags.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version, changelog and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 scripts/release_notes.py --version "$RELEASE_TAG" --output RELEASE_NOTES.md
      - name: Publish the owner's existing tag
        env:
          # Repository token lets release publication trigger deploy.yml.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          : "${GH_TOKEN:?Configure GH_TOKEN with release permission}"
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
