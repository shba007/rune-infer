name: Rust Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-publication
  cancel-in-progress: false
jobs:
  release:
    if: >-
      startsWith(github.event.head_commit.message, 'ci(release): publish v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: xtask -> target
      - name: Validate owner promotion and exact prepared notes
        id: release
        run: |
          cargo run --locked --manifest-path xtask/Cargo.toml -- verify-promotion
          cargo run --locked --manifest-path xtask/Cargo.toml -- notes --out RELEASE_NOTES.md
          VERSION=$(cargo run --quiet --locked --manifest-path xtask/Cargo.toml -- version)
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "Release tag already exists; historical releases are never replaced" >&2
            exit 1
          fi
      - name: Publish prepared version after owner promotion
        env:
          # A PAT/App credential lets release.published trigger CD.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          : "${GH_TOKEN:?Configure GH_TOKEN with Contents write for release publication}"
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file RELEASE_NOTES.md
