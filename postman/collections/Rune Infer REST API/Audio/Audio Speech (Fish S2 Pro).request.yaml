$kind: http-request
name: Audio Speech (Fish S2 Pro)
description: |-
  Generate WAV speech using the exact local fish-audio-s2-pro model ID.
  This request uses the native default voice at normal speed. Named voices,
  other speeds and non-WAV formats are rejected. Reference voice cloning is
  not advertised by this request. Save the response as a .wav file to listen.
url: '{{base_url}}/v1/audio/speech'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{api_key}}'
body:
  type: json
  content: |-
    {
      "model": "fish-audio-s2-pro",
      "input": "Hello. This is a speech test.",
      "response_format": "wav",
      "speed": 1.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Fish speech succeeds", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test("Returns WAV", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("audio/wav"));
      }
order: 4120
