$kind: http-request
name: Audio Speech (VoxCPM2 audio.cpp)
description: |-
  Generate WAV speech using the separate local voxcpm2-audiocpp GGUF entry.
  The existing voxcpm2 CrispASR configuration is preserved. This request uses
  the native default voice at normal speed. Named voices, other speeds and
  non-WAV formats are rejected. Cloning and voice design remain unadvertised.
url: '{{base_url}}/v1/audio/speech'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{api_key}}'
body:
  type: json
  content: |-
    {
      "model": "voxcpm2-audiocpp",
      "input": "Hello. This is a speech test.",
      "response_format": "wav",
      "speed": 1.0
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("VoxCPM2 speech succeeds", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        pm.test("Returns WAV", () => pm.expect(pm.response.headers.get("Content-Type")).to.include("audio/wav"));
      }
order: 4130
