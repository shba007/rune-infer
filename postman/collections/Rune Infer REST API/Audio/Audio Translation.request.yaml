$kind: http-request
description: |-
  Translate speech into English with a model whose GET /v1/models metadata has
  audio_operations.speech_translation.status = supported. Select an audio file.
  audio-to-text does not imply translation. Unsupported operations return 400
  model_operation_unsupported; unverified operations return 503
  model_operation_unverified before inference. Parakeet is unsupported in its
  current ASR-only configuration. Whisper Large v3 Full is live-verified here.
url: "{{base_url}}/v1/audio/translations"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - ''
      disabled: false
    - type: text
      key: model
      value: whisper-large-v3-full
      disabled: false
    - type: text
      key: response_format
      value: json
      disabled: false
    - type: text
      key: temperature
      value: "0.0"
      disabled: false
examples: .resources/Audio Translation.resources/examples
order: 4200
