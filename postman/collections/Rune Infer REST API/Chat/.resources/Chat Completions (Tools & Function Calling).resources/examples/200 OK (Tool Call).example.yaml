$kind: http-example
name: 200 OK (Tool Call Triggered)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "qwen3.5-0.8b",
        "messages": [
          {
            "role": "user",
            "content": "What is the current weather in Amsterdam?"
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "get_current_weather",
              "description": "Get the current weather for a location",
              "parameters": {
                "type": "object",
                "properties": {
                  "location": { "type": "string" },
                  "unit": { "type": "string", "enum": ["celsius", "fahrenheit"] }
                },
                "required": ["location"]
              }
            }
          }
        ],
        "tool_choice": "auto"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-tools-8x19b",
        "object": "chat.completion",
        "created": 1727827255,
        "model": "qwen3.5-0.8b",
        "system_fingerprint": "fp_rune_rust_v1",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": null,
              "tool_calls": [
                {
                  "id": "call_amsterdam_weather_001",
                  "type": "function",
                  "function": {
                    "name": "get_current_weather",
                    "arguments": "{\"location\":\"Amsterdam, Netherlands\",\"unit\":\"celsius\"}"
                  }
                }
              ]
            },
            "finish_reason": "tool_calls"
          }
        ],
        "usage": {
          "prompt_tokens": 84,
          "completion_tokens": 24,
          "total_tokens": 108
        }
      }
order: 2200
