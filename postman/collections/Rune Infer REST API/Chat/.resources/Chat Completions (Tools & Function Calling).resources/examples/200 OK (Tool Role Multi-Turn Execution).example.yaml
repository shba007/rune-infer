$kind: http-example
name: 200 OK (Tool Role Multi-Turn Execution)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "qwen3.5-0.8b",
        "messages": [
          {
            "role": "user",
            "content": "What is the current weather in Amsterdam?"
          },
          {
            "role": "assistant",
            "content": null,
            "tool_calls": [
              {
                "id": "call_amsterdam_weather_001",
                "type": "function",
                "function": {
                  "name": "get_current_weather",
                  "arguments": "{\"location\":\"Amsterdam, Netherlands\",\"unit\":\"celsius\"}"
                }
              }
            ]
          },
          {
            "role": "tool",
            "tool_call_id": "call_amsterdam_weather_001",
            "content": "{\"temperature\": 16, \"condition\": \"partly cloudy\", \"humidity\": 68}"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-tools-8x19c",
        "object": "chat.completion",
        "created": 1727827260,
        "model": "qwen3.5-0.8b",
        "system_fingerprint": "fp_rune_rust_v1",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": "The current weather in Amsterdam is partly cloudy with a temperature of 16°C and 68% humidity.",
              "tool_calls": null
            },
            "finish_reason": "stop"
          }
        ],
        "usage": {
          "prompt_tokens": 128,
          "completion_tokens": 22,
          "total_tokens": 150
        }
      }
order: 2210
