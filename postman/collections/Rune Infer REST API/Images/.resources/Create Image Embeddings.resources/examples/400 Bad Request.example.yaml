$kind: http-example
name: 400 Bad Request
request:
  url: '{{base_url}}/v1/images/embeddings'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "clip-vit-large-patch14",
        "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
        "regions": [
          {
            "box": [1.5, 0.2, 0.3, 0.4]
          }
        ]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Region bounding box coordinates must be normalized between 0.0 and 1.0.",
          "type": "invalid_request_error",
          "param": "regions[0].box",
          "code": "invalid_box_coordinates"
        }
      }
order: 3410
