$kind: http-example
name: 200 OK (Categorical Object Detection)
request:
  url: '{{base_url}}/v1/images/detections'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "yolo-11x-detection",
        "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
        "categories": [
          "car",
          "bus",
          "pedestrian"
        ],
        "confidence_threshold": 0.6,
        "iou_threshold": 0.45
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "det_01J9R4T8Q1V5K3",
        "object": "list",
        "created": 1727827510,
        "model": "yolo-11x-detection",
        "data": [
          {
            "object": "detection",
            "index": 0,
            "label": "car",
            "confidence": 0.942,
            "box": {
              "x": 0.32,
              "y": 0.55,
              "width": 0.28,
              "height": 0.18
            },
            "bbox_pixels": {
              "x_min": 240,
              "y_min": 420,
              "x_max": 450,
              "y_max": 560
            }
          }
        ]
      }
