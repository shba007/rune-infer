$kind: http-example
name: 400 Bad Request (Missing Query)
request:
  url: '{{base_url}}/v1/images/grounding'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "grounding-dino-base",
        "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
        "query": ""
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'query' (or 'target') is a required non-empty string parameter specifying what UI element or object to locate.",
          "type": "invalid_request_error",
          "param": "query",
          "code": "missing_query"
        }
      }
order: 3360
