$kind: http-request
name: Create Image Variation
url: '{{base_url}}/v1/images/variations'
method: POST
body:
  type: formdata
  content:
    - key: image
      type: file
      src: ''
    - key: model
      type: text
      value: '{{image_model}}'
    - key: n
      type: text
      value: '1'
    - key: size
      type: text
      value: '1024x1024'
    - key: response_format
      type: text
      value: 'b64_json'
examples: .resources/Create Image Variation.resources/examples
order: 3200
