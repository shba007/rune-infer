$kind: http-request
description: |-
  Create a soft grayscale alpha matte aligned with the orientation-corrected
  source image. Set portrait_image_data_url to a PNG, JPEG, or WebP data URI.
  For example, in PowerShell:
  'data:image/jpeg;base64,' + [Convert]::ToBase64String([IO.File]::ReadAllBytes("C:\path\portrait.jpg"))

  The response includes alpha_matte, width, height, inference_width,
  inference_height, source limits, and exif_orientation_applied. The matte is
  a PNG data URI: 0 is transparent and 255 is opaque. Use GET /v1/models to
  find models with portrait_matting.status set to verified.

  The example model requires the verified ONNX CUDA runtime on Windows x64,
  12 GiB available RAM and 12 GiB free GPU memory. It uses a fixed 1024x1024
  inference grid, so fine detail can be softened for larger source images.
url: "{{base_url}}/v1/images/portrait-mattings"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{api_key}}
body:
  type: json
  content: |-
    {
      "model": "{{portrait_matting_model}}",
      "image": "data:image/png;base64,"
    }
scripts:
  - type: beforeRequest
    code: |-
      const image = pm.variables.get("portrait_image_data_url");
      if (typeof image !== "string" || !/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/]+={0,2}$/i.test(image)) {
        throw new Error("Set portrait_image_data_url to a complete PNG, JPEG, or WebP base64 data URI.");
      }
  - type: afterResponse
    code: |-
      pm.test("Portrait matting succeeds", () => pm.response.to.have.status(200));
      if (pm.response.code === 200) {
        const result = pm.response.json();
        pm.test("Returns a PNG alpha matte and dimensions", () => {
          pm.expect(result.alpha_matte).to.match(/^data:image\/png;base64,/);
          pm.expect(result.width).to.be.above(0);
          pm.expect(result.height).to.be.above(0);
          pm.expect(result.inference_width).to.be.above(0);
          pm.expect(result.inference_height).to.be.above(0);
        });
      }
order: 3306
