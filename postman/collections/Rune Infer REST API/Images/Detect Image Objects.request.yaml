$kind: http-request
name: Detect Image Objects
description: |-
  Performs open-vocabulary object detection, category classification, segmentation masks, pose keypoints, and face attributes.
  
  **Coordinate format conventions:**
  - `box`: Normalized bounding box `[0.0, 1.0]`. **`x` and `y` represent the CENTRE of the box**, not the top-left corner (`{ x: center_x, y: center_y, width: w, height: h }` in YOLO format).
  - `bbox_pixels`: Absolute bounding box in image pixel coordinates using corners: `{ x_min, y_min, x_max, y_max }`.
url: '{{base_url}}/v1/images/detections'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{api_key}}'
body:
  type: json
  content: |-
    {
      "model": "{{detection_model}}",
      "image": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
      "prompt": "pink mug, person with sunglasses, car",
      "categories": ["face", "jewellery", "car"],
      "confidence_threshold": 0.25,
      "iou_threshold": 0.45,
      "features": [
        "boxes",
        "masks",
        "keypoints",
        "attributes"
      ]
    }
examples: .resources/Detect Image Objects.resources/examples
order: 3300
