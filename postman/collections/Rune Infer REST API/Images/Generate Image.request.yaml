$kind: http-request
name: Generate Image
url: '{{base_url}}/v1/images/generations'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "model": "{{image_model}}",
      "prompt": "A serene mountain landscape at sunset with golden light reflecting off a calm lake, surrounded by pine trees",
      "n": 1,
      "size": "1024x1024",
      "quality": "standard",
      "response_format": "b64_json"
    }
scripts:
  - type: afterResponse
    code: |-
      const template = `
      <!DOCTYPE html>
      <html>
      <head>
        <meta charset="utf-8">
        <style>
          body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
          }
          .card {
            background: #1e1e1e;
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            margin-bottom: 24px;
            max-width: 95%;
            text-align: center;
            border: 1px solid #2a2a2a;
          }
          img {
            max-width: 100%;
            max-height: 75vh;
            height: auto;
            border-radius: 6px;
            border: 1px solid #333;
            display: block;
            margin: 0 auto;
          }
          .footer {
            margin-top: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #888;
            gap: 16px;
          }
          .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #ff6c37;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
          }
          .btn:hover {
            background: #e05524;
          }
          #status {
            font-size: 14px;
            color: #aaa;
          }
          .error {
            color: #ff5555;
          }
        </style>
      </head>
      <body>
        <div id="container">
          <div id="status">Loading image...</div>
        </div>

        <script>
          pm.getData(function (err, data) {
            const container = document.getElementById('container');
            
            if (err || !data) {
              container.innerHTML = '<div class="error">Failed to load data: ' + (err || 'No data') + '</div>';
              return;
            }

            const items = data.data || [];
            if (!items.length) {
              container.innerHTML = '<div class="error">No image found in response data.</div>';
              return;
            }

            container.innerHTML = '';

            items.forEach(function (item, index) {
              let src = '';
              if (item.b64_json) {
                src = item.b64_json.startsWith('data:') 
                  ? item.b64_json 
                  : 'data:image/png;base64,' + item.b64_json;
              } else if (item.url) {
                src = item.url;
              }

              if (!src) {
                container.innerHTML += '<div class="error">Image ' + index + ' has neither b64_json nor url</div>';
                return;
              }

              const card = document.createElement('div');
              card.className = 'card';

              const img = document.createElement('img');
              img.src = src;
              img.alt = 'Generated Image ' + index;

              const footer = document.createElement('div');
              footer.className = 'footer';

              const info = document.createElement('span');
              info.innerHTML = 'Image #' + (index + 1) + (data.created ? ' &bull; Created: ' + data.created : '');

              const downloadBtn = document.createElement('a');
              downloadBtn.className = 'btn';
              downloadBtn.href = src;
              downloadBtn.download = 'generated_' + (index + 1) + '.png';
              downloadBtn.innerText = 'Download PNG';

              footer.appendChild(info);
              footer.appendChild(downloadBtn);

              card.appendChild(img);
              card.appendChild(footer);
              container.appendChild(card);
            });
          });
        </script>
      </body>
      </html>
      `;

      if (pm.response.code === 200) {
          pm.visualizer.set(template, pm.response.json());
      }
    language: text/javascript
examples: .resources/Generate Image.resources/examples
order: 3000
