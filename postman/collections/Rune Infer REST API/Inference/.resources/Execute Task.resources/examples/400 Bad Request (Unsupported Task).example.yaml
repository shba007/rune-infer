$kind: http-example
name: 400 Bad Request (Unsupported Task)
request:
  url: '{{base_url}}/v1/inference?engine=minicpm-o-4-5-q8-0'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "type": "embedding",
        "input": ["Hello"]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Model 'minicpm-o-4-5-q8-0' does not support text-to-embedding",
          "type": "invalid_request_error",
          "param": null,
          "code": "model_task_unsupported"
        }
      }
