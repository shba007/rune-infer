$kind: http-request
name: Execute Task
url: '{{base_url}}/v1/inference?engine={{chat_model}}'
method: POST
queryParams:
  - key: engine
    value: '{{chat_model}}'
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{api_key}}'
body:
  type: json
  content: |-
    {
      "type": "tool_call",
      "prompt": "Reply with READY only.",
      "schema": [],
      "images": [],
      "audios": [],
      "max_tokens": 64,
      "temperature": 0
    }
examples: .resources/Execute Task.resources/examples
order: 10000
