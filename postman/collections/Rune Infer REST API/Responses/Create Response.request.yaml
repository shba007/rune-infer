$kind: http-request
name: Create Response
url: '{{base_url}}/v1/responses'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "model": "{{chat_model}}",
      "input": "Calculate the fibonacci of 8",
      "instructions": "You are a concise computational assistant.",
      "tools": [
        {
          "type": "function",
          "name": "calculate_fibonacci",
          "description": "Calculates the nth Fibonacci number",
          "parameters": {
            "type": "object",
            "properties": {
              "n": { "type": "integer" }
            },
            "required": ["n"]
          }
        }
      ]
    }
examples: .resources/Create Response.resources/examples
order: 5200
