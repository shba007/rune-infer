$kind: http-example
name: 400 Bad Request (Invalid Frames)
request:
  url: '{{base_url}}/v1/videos/generations'
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "model": "{{video_model}}",
        "prompt": "A red fox running through snow",
        "frames": 500
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'frames' must be between 1 and 257",
          "type": "invalid_request_error",
          "param": "frames",
          "code": "invalid_parameter_value"
        }
      }
order: 1020
