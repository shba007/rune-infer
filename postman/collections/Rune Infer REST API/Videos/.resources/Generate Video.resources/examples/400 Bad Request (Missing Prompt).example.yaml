$kind: http-example
name: 400 Bad Request (Missing Prompt)
request:
  url: '{{base_url}}/v1/videos/generations'
  method: POST
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "model": "{{video_model}}",
        "prompt": ""
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'prompt' is a required string field for video generation.",
          "type": "invalid_request_error",
          "param": "prompt",
          "code": "invalid_parameter_value"
        }
      }
order: 1010
