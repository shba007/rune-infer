$kind: http-example
name: 200 OK
request:
  url: '{{base_url}}/v1/audio/transcriptions'
  method: POST
  body:
    type: formdata
    content:
      - key: model
        type: text
        value: 'whisper-large-v3-turbo'
      - key: language
        type: text
        value: 'en'
      - key: response_format
        type: text
        value: 'json'
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "text": "Rune Infer is a standalone config-driven model server written in Rust."
      }
order: 4000
