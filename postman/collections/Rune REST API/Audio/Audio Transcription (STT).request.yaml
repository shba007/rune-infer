$kind: http-request
name: Audio Transcription (STT)
url: '{{base_url}}/v1/audio/transcriptions'
method: POST
body:
  type: formdata
  content:
    - key: file
      type: file
      src: ''
    - key: model
      type: text
      value: '{{asr_model}}'
    - key: language
      type: text
      value: 'en'
    - key: response_format
      type: text
      value: 'json'
    - key: temperature
      type: text
      value: '0.0'
examples: .resources/Audio Transcription (STT).resources/examples
order: 4000
