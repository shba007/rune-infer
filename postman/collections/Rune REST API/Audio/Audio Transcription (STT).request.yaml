$kind: http-request
url: "{{base_url}}/v1/audio/transcriptions"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src:
        - /D:/Projects/Public/rune/code-infer/static/artifacts/audios/audio_3.wav
      disabled: false
    - type: text
      key: model
      value: "{{asr_model}}"
      disabled: false
    - type: text
      key: language
      value: en
      disabled: false
    - type: text
      key: response_format
      value: json
      disabled: false
    - type: text
      key: temperature
      value: "0.0"
      disabled: false
examples: .resources/Audio Transcription (STT).resources/examples
order: 4000
