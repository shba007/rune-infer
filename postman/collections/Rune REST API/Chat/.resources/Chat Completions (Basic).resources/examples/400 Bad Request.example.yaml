$kind: http-example
name: 400 Bad Request
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "model": "qwen3.5-0.8b",
        "messages": "Invalid string instead of array"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'messages' field must be an array of message objects.",
          "type": "invalid_request_error",
          "param": "messages",
          "code": "invalid_type"
        }
      }
order: 2010
