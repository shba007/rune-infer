$kind: http-example
name: 200 OK (Video Sequence Analysis)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "qwen3.8-27b",
        "messages": [
          {
            "role": "user",
            "content": [
              {
                "type": "text",
                "text": "Please analyze this video and describe the key events, actions, and temporal progression."
              },
              {
                "type": "video_url",
                "video_url": {
                  "url": "D:/Projects/Public/rune/code-infer/static/artifacts/videos/test.mp4"
                }
              }
            ]
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-video-001",
        "object": "chat.completion",
        "created": 1727827310,
        "model": "qwen3.8-27b",
        "system_fingerprint": "fp_rune_rust_v1",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": "The video sequence shows a robot arm picking up a mechanical part from a conveyor belt at 0:02, rotating it 90 degrees, and placing it into an assembly dock at 0:05.",
              "refusal": null
            },
            "finish_reason": "stop"
          }
        ],
        "usage": {
          "prompt_tokens": 420,
          "completion_tokens": 42,
          "total_tokens": 462
        }
      }
order: 2420
