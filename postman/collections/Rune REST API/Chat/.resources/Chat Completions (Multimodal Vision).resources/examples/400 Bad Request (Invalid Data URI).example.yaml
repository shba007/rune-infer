$kind: http-example
name: 400 Bad Request (Invalid Data URI)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "Invalid base64 image data URI format in 'messages[0].content[1].image_url.url'.",
          "type": "invalid_request_error",
          "param": "image_url.url",
          "code": "invalid_image_format"
        }
      }
order: 2410
