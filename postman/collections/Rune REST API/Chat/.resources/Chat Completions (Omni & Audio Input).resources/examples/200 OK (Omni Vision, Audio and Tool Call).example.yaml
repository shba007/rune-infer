$kind: http-example
name: 200 OK (Omni Vision, Audio and Tool Call)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "gemma-4-12b-it",
        "messages": [
          {
            "role": "user",
            "content": [
              {
                "type": "text",
                "text": "Analyze the UI screenshot and transcribe the user's spoken voice command to trigger the right action."
              },
              {
                "type": "image_url",
                "image_url": {
                  "url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
                }
              },
              {
                "type": "input_audio",
                "input_audio": {
                  "data": "UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAAB9AAACABAAZGF0YQAAAAA=",
                  "format": "wav"
                }
              }
            ]
          }
        ],
        "tools": [
          {
            "type": "function",
            "function": {
              "name": "click_coordinate",
              "description": "Click screen coordinates",
              "parameters": {
                "type": "object",
                "properties": {
                  "x": { "type": "number" },
                  "y": { "type": "number" }
                },
                "required": ["x", "y"]
              }
            }
          }
        ],
        "tool_choice": "required"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-omni-01J9R4T8Q4M",
        "object": "chat.completion",
        "created": 1727827600,
        "model": "gemma-4-12b-it",
        "system_fingerprint": "fp_rune_rust_v1",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": null,
              "tool_calls": [
                {
                  "id": "call_12345",
                  "type": "function",
                  "function": {
                    "name": "click_coordinate",
                    "arguments": "{\"x\": 850, \"y\": 750}"
                  }
                }
              ]
            },
            "finish_reason": "tool_calls"
          }
        ],
        "usage": {
          "prompt_tokens": 142,
          "completion_tokens": 28,
          "total_tokens": 170
        }
      }
order: 2500
