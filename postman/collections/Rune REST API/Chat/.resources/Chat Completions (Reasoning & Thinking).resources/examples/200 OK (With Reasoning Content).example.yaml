$kind: http-example
name: 200 OK (With Reasoning Content)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "ternary-bonsai-2-27b-pq2-0",
        "messages": [
          {
            "role": "user",
            "content": "In a room of 30 people, what is the exact probability that at least two people share a birthday? Show your step-by-step mathematical reasoning."
          }
        ],
        "reasoning_effort": "high",
        "max_tokens": 4096
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "id": "chatcmpl-think-01J9R4T8Q4M",
        "object": "chat.completion",
        "created": 1727827700,
        "model": "ternary-bonsai-2-27b-pq2-0",
        "system_fingerprint": "fp_rune_rust_v1",
        "choices": [
          {
            "index": 0,
            "message": {
              "role": "assistant",
              "content": "The probability that at least two people in a room of 30 share a birthday is approximately 70.63% (1 - 365! / ((365-30)! * 365^30)).",
              "reasoning_content": "We compute the complementary probability that all 30 people have distinct birthdays: P(distinct) = (365/365) * (364/365) * ... * (336/365) ≈ 0.2937. Therefore, P(at least one match) = 1 - 0.2937 = 0.7063."
            },
            "finish_reason": "stop"
          }
        ],
        "usage": {
          "prompt_tokens": 36,
          "completion_tokens": 128,
          "total_tokens": 164
        }
      }
order: 2600
