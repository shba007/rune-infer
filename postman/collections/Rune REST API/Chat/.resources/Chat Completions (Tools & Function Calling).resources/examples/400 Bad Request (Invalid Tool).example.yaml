$kind: http-example
name: 400 Bad Request (Invalid Tool)
request:
  url: '{{base_url}}/v1/chat/completions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
  body:
    type: json
    content: |-
      {
        "model": "qwen3.5-0.8b",
        "messages": [{ "role": "user", "content": "hi" }],
        "tools": [{ "type": "function", "function": {} }]
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'tools[0].function.name' is a required string property.",
          "type": "invalid_request_error",
          "param": "tools[0].function.name",
          "code": "missing_required_field"
        }
      }
order: 2210
