$kind: http-request
name: Chat Completions (Basic)
url: '{{base_url}}/v1/chat/completions'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "model": "{{chat_model}}",
      "messages": [
        {
          "role": "system",
          "content": "You are a concise, helpful assistant."
        },
        {
          "role": "user",
          "content": "Explain Rust ownership in one sentence."
        }
      ],
      "temperature": 0.7,
      "max_tokens": 128,
      "stream": false
    }
examples: .resources/Chat Completions (Basic).resources/examples
order: 2000
