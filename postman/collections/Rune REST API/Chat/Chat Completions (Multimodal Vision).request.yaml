$kind: http-request
name: Chat Completions (Multimodal Vision)
url: '{{base_url}}/v1/chat/completions'
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "model": "{{vision_model}}",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "What does this image show?"
            },
            {
              "type": "image_url",
              "image_url": {
                "url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
              }
            }
          ]
        }
      ]
    }
examples: .resources/Chat Completions (Multimodal Vision).resources/examples
order: 2400
