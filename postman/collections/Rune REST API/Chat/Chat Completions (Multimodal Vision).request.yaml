$kind: http-request
url: "{{base_url}}/v1/chat/completions"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "model": "{{vision_model}}",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "What does this image show?"
            },
            {
              "type": "image_url",
              "image_url": {
                "url": "data:image/png;base64,"
              }
            }
          ]
        }
      ]
    }
examples: .resources/Chat Completions (Multimodal Vision).resources/examples
order: 2400
