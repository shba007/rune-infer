$kind: http-request
url: "{{base_url}}/v1/chat/completions"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{api_key}}
body:
  type: json
  content: |-
    {
      "model": "{{omni_model}}",
      "messages": [
        {
          "role": "user",
          "content": [
            {
              "type": "text",
              "text": "Analyze the UI screenshot and transcribe the user's spoken voice command to trigger the right action."
            },
            {
              "type": "image_url",
              "image_url": {
                "url": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
              }
            },
            {
              "type": "input_audio",
              "input_audio": {
                "data": "",
                "format": "wav"
              }
            }
          ]
        }
      ],
      "tools": [
        {
          "type": "function",
          "function": {
            "name": "click_coordinate",
            "description": "Click screen coordinates",
            "parameters": {
              "type": "object",
              "properties": {
                "x": { "type": "number" },
                "y": { "type": "number" }
              },
              "required": ["x", "y"]
            }
          }
        }
      ],
      "tool_choice": "auto"
    }
examples: .resources/Chat Completions (Omni & Audio Input).resources/examples
order: 2500
