$kind: http-example
name: 200 OK (Multimodal State with Questions List)
request:
  url: '{{base_url}}/v1/decisions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "liquid-d1-3b",
        "state": {
          "text": "User requests deployment of container build to production cluster with active traffic.",
          "images": [
            "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
          ]
        },
        "questions": [
          {
            "name": "routing",
            "type": "choice",
            "instruction": "Select routing path for execution",
            "criteria": ["canary_rollout", "blue_green", "immediate_switch"]
          },
          {
            "name": "requires_approval",
            "type": "noul",
            "instruction": "Does this action require manual principal engineer signoff?"
          },
          {
            "name": "risk_score",
            "type": "score",
            "instruction": "Assess systemic risk level of deployment"
          }
        ]
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "model": "liquid-d1-3b",
        "answers": {
          "routing": {
            "type": "choice",
            "value": "canary_rollout",
            "confidence": 0.94
          },
          "requires_approval": {
            "type": "noul",
            "value": "yes",
            "confidence": 0.89
          },
          "risk_score": {
            "type": "score",
            "value": 0.42,
            "confidence": 0.91
          }
        },
        "usage": {
          "prompt_tokens": 285,
          "completion_tokens": 25,
          "total_tokens": 310
        }
      }
order: 11000
