$kind: http-example
name: 400 Bad Request (Empty Questions)
request:
  url: '{{base_url}}/v1/decisions'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "liquid-d1-3b",
        "state": "System memory usage at 96%",
        "questions": []
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'questions' is a required non-empty list of decision questions.",
          "type": "invalid_request_error",
          "param": "questions",
          "code": "empty_questions"
        }
      }
order: 11100
