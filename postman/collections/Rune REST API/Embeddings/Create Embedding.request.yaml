$kind: http-request
url: "{{base_url}}/v1/embeddings"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "model": "{{embedding_model}}",
      "input": "Rune Infer high performance system in Rust",
      "encoding_format": "float"
    }
examples: .resources/Create Embedding.resources/examples
order: 5000
