$kind: http-example
name: 200 OK
request:
  url: '{{base_url}}/v1/images/edits'
  method: POST
  headers:
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: formdata
    content:
      - key: image
        type: file
        src: source_image.png
      - key: mask
        type: file
        src: mask_image.png
      - key: prompt
        type: text
        value: A sun shining warmly through the trees
      - key: model
        type: text
        value: '{{image_model}}'
      - key: size
        type: text
        value: 1024x1024
      - key: response_format
        type: text
        value: b64_json
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "created": 1727827550,
        "data": [
          {
            "b64_json": ""
          }
        ]
      }
order: 3100
