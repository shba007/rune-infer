$kind: http-example
name: 400 Bad Request
request:
  url: '{{base_url}}/v1/images/detections'
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Authorization
      value: 'Bearer {{api_key}}'
  body:
    type: json
    content: |-
      {
        "model": "yolo-11x-detection"
      }
response:
  statusCode: 400
  statusText: Bad Request
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "message": "'image' is a required string field containing a URL or base64 data URI.",
          "type": "invalid_request_error",
          "param": "image",
          "code": "missing_required_image"
        }
      }
order: 3310
