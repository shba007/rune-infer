$kind: http-example
name: 200 OK (Ready Probe)
request:
  url: '{{base_url}}/health?probe=ready'
  method: GET
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ready",
        "service": "rune-infer",
        "version": "0.6.0",
        "models_configured": 43,
        "models_loaded": [
          "gemma-4-12b-it"
        ],
        "models_loading": []
      }
order: 1020
