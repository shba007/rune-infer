$kind: http-example
name: 200 OK (Standard Health Check)
request:
  url: '{{base_url}}/health'
  method: GET
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "service": "rune-infer",
        "version": "0.6.0",
        "backend": "candle-cuda",
        "loaded_models": [
          "gemma-4-12b-it"
        ]
      }
order: 1000
