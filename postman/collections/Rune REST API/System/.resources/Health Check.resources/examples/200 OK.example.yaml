$kind: http-example
name: 200 OK
request:
  url: '{{base_url}}/health'
  method: GET
  headers:
    - key: Accept
      value: application/json
response:
  statusCode: 200
  statusText: OK
  headers:
    content-type: application/json
  body:
    type: json
    content: |-
      {
        "status": "ok",
        "service": "rune-infer",
        "version": "0.1.0",
        "backend": "candle-cuda"
      }
order: 1000
