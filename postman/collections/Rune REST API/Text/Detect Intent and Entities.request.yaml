$kind: http-request
name: Detect Intent and Entities
url: '{{base_url}}/v1/nlu/intents'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{api_key}}'
body:
  type: json
  content: |-
    {
      "model": "{{nlu_model}}",
      "text": "Book a business flight to New York for Dr. Jane tomorrow at 9 AM",
      "candidate_intents": ["book_flight", "check_weather", "cancel_reservation"],
      "candidate_entities": ["destination", "passenger", "time", "date"]
    }
examples: .resources/Detect Intent and Entities.resources/examples
order: 2500
